# Revalidate this app's assets after source edits in the bind-mounted preview.
# Apply after Nextcloud's conditional cache headers in .htaccess.
<LocationMatch "^/custom_apps/inventorycheck/(js|css|l10n|img)/">
    <If "true">
        Header onsuccess unset Cache-Control
        Header always set Cache-Control "no-cache"
    </If>
</LocationMatch>
