name: ncinventory-dev

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: inventorycheck-local
    volumes:
      - ../.tools/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U nextcloud -d nextcloud]
      interval: 2s
      timeout: 5s
      retries: 30

  nextcloud:
    image: nextcloud:33-apache
    ports:
      - ${NEXTCLOUD_BIND_ADDRESS:-127.0.0.1}:8086:80
    depends_on:
      database:
        condition: service_healthy
    environment:
      POSTGRES_HOST: database
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: inventorycheck-local
      NEXTCLOUD_ADMIN_USER: workspace-admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-workspace-local-test}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost 127.0.0.1}
    volumes:
      - ../.tools/nextcloud:/var/www/html
      - ..:/var/www/html/custom_apps/inventorycheck:ro
      - ./apache-assets.conf:/etc/apache2/conf-enabled/inventorycheck-assets.conf:ro
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 5s
      timeout: 10s
      retries: 60
